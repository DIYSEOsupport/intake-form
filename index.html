<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIYSEO Intake Form</title>
<style>
  :root { --bg:#f6efd9; --surface:#fffaf0; --ink:#1c2d3d; --muted:#536474; --line:#dfd4b9; --blue:#385873; --orange:#df793d; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; margin:0; padding:24px 16px; }
  main { max-width:680px; margin:0 auto; }
  img { width:100%; border-radius:8px 8px 0 0; display:block; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:20px 24px; margin-bottom:12px; }
  .intro { border-top:8px solid var(--blue); border-radius:0 0 8px 8px; }
  h1 { margin:0 0 8px; font-size:28px; }
  .desc { color:var(--muted); white-space:pre-line; }
  .q { font-weight:600; margin-bottom:12px; }
  .ex { color:var(--muted); font-size:13px; margin:-8px 0 12px; }
  .q::after { content:" *"; color:#d93025; }
  textarea { width:100%; box-sizing:border-box; border:0; border-bottom:1px solid var(--line); background:transparent; font:inherit; resize:vertical; }
  textarea, input[type=email] { width:100%; box-sizing:border-box; border:0; border-bottom:1px solid var(--line); background:transparent; font:inherit; }
  textarea:focus, input[type=email]:focus { outline:none; border-bottom:2px solid var(--blue); }
  label { display:block; margin:8px 0; }
  input[type=radio] { accent-color:var(--blue); }
  a { color:var(--blue); text-decoration-color:var(--orange); transition:color .2s; }
  a:hover { color:var(--orange); }
  .contact { text-align:right; }
  .end-logo { text-align:right; }
  .end-logo img { width:120px; border-radius:50%; display:inline-block; }

  /* motion + brand glows (blue = 56,88,115 · orange = 223,121,61) */
  .card, button, label, img, textarea { transition:transform .2s ease, box-shadow .2s ease, background-color .2s ease, border-color .2s ease; }
  main > img:first-child:hover { box-shadow:0 0 18px rgba(56,88,115,.25); }
  .card:hover { transform:translateY(-2px); border-color:var(--blue); box-shadow:0 6px 20px rgba(56,88,115,.18); }
  .card:focus-within { border-color:var(--orange); box-shadow:0 0 0 2px rgba(223,121,61,.35), 0 0 22px rgba(223,121,61,.25); }
  label { padding:4px 8px; border-radius:4px; cursor:pointer; }
  label:hover { background:rgba(56,88,115,.08); }
  button { cursor:pointer; }
  button:hover { transform:translateY(-1px); box-shadow:0 0 0 3px rgba(223,121,61,.3), 0 0 20px rgba(223,121,61,.45); }
  button:active { transform:scale(.97); }
  .end-logo img:hover { transform:scale(1.06); box-shadow:0 0 22px rgba(56,88,115,.4); }
  #qs .card, .intro { animation:rise .4s ease both; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
  .print-only { display:none !important; }
  @media print { .print-only { display:block !important; } .end-logo .print-only { display:inline-block !important; } .screen-only { display:none !important; } }
  button { background:var(--blue); color:var(--surface); border:0; padding:10px 24px; border-radius:4px; font-weight:600; }
</style>
</head>
<body>
<main>
  <img class="screen-only" src="form-header.gif" alt="DIYSEO"><img class="print-only" src="form-header.png" alt="DIYSEO">
  <div class="card intro"><h1 id="title"></h1><div class="desc" id="desc"></div></div>
  <form id="f">
  <div class="card"><div class="q">Your email</div><input type="email" name="emailAddress" required></div>
  <div id="qs"></div>
  <!-- animated on screen, static (arrow pointing right way) when printed -->
  <div class="end-logo"><img class="screen-only" src="logo-small.gif" alt="DIYSEO"><img class="print-only" src="logo-small.png" alt="DIYSEO"></div>
  <button>Submit</button>
  </form>
</main>
<script>
// Renders the questions straight from create-form.gs, so this preview never drifts from the real form.
// shortcut: regex-parses the script's own simple call style; breaks if questions use other FormApp calls.
fetch('create-form.gs').then(r => r.text()).then(src => {
  const unq = s => s.trim().replace(/^'|'$/g, '').replace(/\\n/g, '\n');
  document.getElementById('title').textContent = unq(src.match(/FormApp\.create\(('[^']*')/)[1]);
  document.getElementById('desc').textContent = [...src.match(/setDescription\(([\s\S]*?)\)\n/)[1].matchAll(/'([^']*)'/g)].map(m => unq(m[1])).join('');
  const desc = document.getElementById('desc'); // text first (escaped), then turn email/phone into links
  desc.innerHTML = desc.innerHTML
    .replace(/[\w.]+@[\w.]+\w/g, e => `<a href="mailto:${e}">${e}</a>`)
    .replace(/\d{3}\.\d{3}\.\d{4}/g, p => `<a href="tel:+1${p.replace(/\./g, '')}">${p}</a>`)
    .split('\n').map(l => l.startsWith('•') ? `<div class="contact">${l}</div>` : l + '\n').join('').trim();
  const qs = document.getElementById('qs');
  for (const m of src.matchAll(/^\s*(para|choice)\('([^']*)'(?:,\s*'([^']*)')?(?:,\s*\[([\s\S]*?)\])?\);/gm)) {
    const card = document.createElement('div'); card.className = 'card';
    const q = document.createElement('div'); q.className = 'q'; q.textContent = m[2]; card.append(q);
    if (m[3]) { const ex = document.createElement('div'); ex.className = 'ex'; ex.textContent = m[3]; card.append(ex); }
    if (m[1] === 'para') { const t = document.createElement('textarea'); t.required = true; card.append(t); }
    else for (const [, opt] of m[4].matchAll(/'([^']*)'/g)) {
      const l = document.createElement('label'); const r = document.createElement('input');
      r.type = 'radio'; r.name = m[2]; r.value = opt; r.required = true; l.append(r, ' ' + opt); card.append(l);
    }
    qs.append(card);
  }
  thanks = unq(src.match(/setConfirmationMessage\(('[^']*')/)[1]);
});

// Sends answers into the Google Form. Fill in from the "Web page hookup" line create-form.gs logs.
const FORM = { action: '', entries: [] };
let thanks = '';
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  if (!FORM.action) return alert('This form is not connected yet. Please call or email us instead.');
  const body = new URLSearchParams({ emailAddress: e.target.emailAddress.value });
  document.querySelectorAll('#qs .card').forEach((card, i) => {
    const v = card.querySelector('textarea, input:checked');
    body.append(FORM.entries[i], v ? v.value : '');
  });
  // no-cors: Google won't let us read the reply, so we can't confirm it landed. Check the Sheet.
  fetch(FORM.action, { method: 'POST', mode: 'no-cors', body }).then(() => {
    e.target.outerHTML = `<div class="card"><h1>Thank you</h1><p>${thanks}</p></div>`;
    scrollTo(0, 0);
  }, () => alert('Could not send. Please check your connection and try again.'));
});
</script>
</body>
</html>
