<script>
// both logos spin at the same speed (60 frames x 40ms) but each starts when it loads; restart them together
addEventListener('load', () => {
  const imgs = [...document.querySelectorAll('img[src$=".gif"]')];
  Promise.all(imgs.map(i => fetch(i.src).then(r => r.blob()).then(b => URL.createObjectURL(b))))
    .then(urls => imgs.forEach((i, k) => i.src = urls[k])).catch(() => {});
});
// Renders the questions straight from intake-form-google.gs, so this preview never drifts from the real form.
// shortcut: regex-parses the script's own simple call style; breaks if questions use other FormApp calls.
// shows what they typed as a clickable link under the line (textContent/href only, so typing can't inject HTML)
function livelink(input, kind) {
  const a = document.createElement('a'); a.className = 'live'; a.hidden = true; input.after(a);
  input.addEventListener('input', () => {
    const v = input.value.trim(), digits = v.replace(/\D/g, '');
    const href = kind === 'tel' ? digits.length >= 10 && 'tel:+' + (digits.length === 10 ? '1' : '') + digits
      : kind === 'mailto' ? /\S+@\S+\.\S+/.test(v) && 'mailto:' + v
      : /\S+\.\S+/.test(v) && (/^https?:\/\//i.test(v) ? v : 'https://' + v);
    a.hidden = !href;
    if (href) { a.href = href; a.textContent = v; if (kind === 'url') { a.target = '_blank'; a.rel = 'noopener'; } }
  });
}
// social icons, shown left of the label, in each brand's own colors (Other stays brand blue)
const TT = '<path d="M16 3c.3 2 1.6 3.4 3.5 3.6v2.6c-1.3 0-2.5-.4-3.5-1.1v6.4A5 5 0 1 1 11 9.6v2.7a2.4 2.4 0 1 0 2.4 2.4V3z"';

// a box line: label left, input right. Returns the input.
function row(card, label, ex, type) {
  const l = document.createElement('label'); l.className = 'field'; const sp = document.createElement('span'); sp.textContent = label;
  if (ICONS[label]) sp.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS[label]}</svg>`);
  const wrap = document.createElement('div'); const t = document.createElement('input'); t.type = type || 'text';
  wrap.append(t); l.append(sp, wrap); card.append(l); return t;
}
fetch('intake-form-google.gs').then(r => r.text()).then(src => {
  const unq = s => s.trim().replace(/^'|'$/g, '').replace(/\\n/g, '\n');
  document.getElementById('title').textContent = unq(src.match(/FormApp\.create\(('[^']*')/)[1]);
  document.getElementById('desc').textContent = [...src.match(/setDescription\(([\s\S]*?)\)\n/)[1].matchAll(/'([^']*)'/g)].map(m => unq(m[1])).join('');
  const qs = document.getElementById('qs');

  let into = null; // group box that later questions go inside (until the next section/group)
  for (const m of src.matchAll(/^\s*(section|heading|group|field|link|ifYes|lines|note|explain|para|text|box|upload|choice|checks)\('([^']*)'(?:,\s*'([^']*)')?(?:,\s*\[([\s\S]*?)\])?(?:,\s*(\d+))?\);/gm)) {

    // field / link / ifYes: a line inside the box above (field required, link optional, ifYes shown only after Yes)
    if (m[1] === 'field' || m[1] === 'link' || m[1] === 'ifYes') {
      const card = qs.lastChild, t = row(card, m[2], m[3]); t.dataset.i = i++;
      t.required = m[1] === 'field'; t.parentNode.parentNode.classList.toggle('req', t.required);
      if (m[2] === 'Phone') livelink(t, 'tel'); else if (m[1] !== 'field') livelink(t, 'url');
      if (m[1] === 'ifYes') {
        const l = t.parentNode.parentNode; l.hidden = true;
        card.addEventListener('change', () => { const yes = card.querySelector('[value=Yes]').checked; l.hidden = !yes; t.required = yes; l.classList.toggle('req', yes); if (!yes) { t.value = ''; t.dispatchEvent(new Event('input')); } });
      }

    if (m[1] === 'explain') {
      const prev = (into || qs).lastChild, all = document.createElement('textarea'); all.hidden = true; all.dataset.i = i++;
      const ex = document.createElement('div'); ex.className = 'ex note'; ex.textContent = m[2] + ' ' + (m[3] || ''); prev.append(all, ex);
      prev.querySelectorAll('.opts input[type=checkbox]').forEach(box => {
        const d = document.createElement('div'); d.className = 'explain'; d.hidden = true; d.dataset.name = box.value;
        const name = document.createElement('strong'); name.textContent = box.value;
        const t = document.createElement('textarea'); t.rows = 3; t.placeholder = 'What should it show or say?';
        const f = document.createElement('input'); f.type = 'file'; f.multiple = true; f.accept = 'image/*,.pdf';
        d.append(name, t, f); prev.append(d);
        box.addEventListener('change', () => { d.hidden = !box.checked; t.required = box.checked; });
      });
      const join = () => all.value = [...prev.querySelectorAll('.explain:not([hidden])')].map(d => d.dataset.name + ': ' + d.querySelector('textarea').value.trim()).join('\n\n');
      prev.addEventListener('input', join); prev.addEventListener('change', join);
      continue;
    }
    const head = m[1] === 'section' || m[1] === 'heading' || m[1] === 'group';
    const sub = into && !head;
    const card = document.createElement('div'); card.className = sub ? 'sub' : 'card';
    const q = document.createElement('div'); q.className = m[1] === 'heading' ? 'q section heading' : head ? 'q section' + (m[1] === 'section' ? ' req' : '') : sub ? 'q sub' : 'q'; q.textContent = m[2]; card.append(q);
    if (head) { into = m[1] === 'group' ? card : null; qs.append(card); continue; } // a header, not a question: no entry number
    if (m[3]) { const ex = document.createElement('div'); ex.className = 'ex'; ex.textContent = m[3]; ex.innerHTML = ex.innerHTML.replace(/https?:\/\/[^\s,]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`); card.append(ex); } // web addresses in examples are clickable
    // lines: write-in lines (5 unless a count is given); a hidden box (the real answer) gets them joined, one per line
    if (m[1] === 'lines') {
      const t = document.createElement('textarea'); t.hidden = true; t.dataset.i = i; card.append(t);
      for (let k = 0; k < (+m[5] || 5); k++) { const l = document.createElement('input'); l.type = 'text'; l.className = 'line'; l.required = k === 0; card.append(l); }
      card.addEventListener('input', () => t.value = [...card.querySelectorAll('.line')].map(l => l.value.trim()).filter(Boolean).join('\n'));
    }
    else if (m[1] === 'note') { const t = document.createElement('textarea'); t.dataset.i = i; card.append(t); q.classList.add('optional'); }
    else if (m[1] === 'para') { const t = document.createElement('textarea'); t.required = true; t.dataset.i = i; card.append(t); }
    else if (m[1] !== 'choice' && m[1] !== 'checks') { const t = document.createElement('input'); t.type = 'text'; t.required = m[1] === 'text'; t.dataset.i = i; card.append(t); }
    else {
      const opts = document.createElement('div'); opts.className = m[4].match(/'[^']*'/g).length < 5 ? 'opts list' : 'opts'; opts.dataset.req = ''; card.append(opts);
      for (const [, opt] of m[4].matchAll(/'([^']*)'/g)) {
        const l = document.createElement('label'); const r = document.createElement('input');
        r.type = m[1] === 'checks' ? 'checkbox' : 'radio'; r.name = m[2]; r.value = opt; r.required = r.type === 'radio'; r.dataset.i = i; l.append(r, opt); opts.append(l);
        // write-in box: typing in it ticks Other, and it's required while Other is ticked
        if (opt === 'Other') { const t = document.createElement('input'); t.type = 'text'; t.className = 'other'; l.append(':', t); t.addEventListener('focus', () => { if (!r.disabled && !r.checked) r.click(); }); }
      }
      opts.addEventListener('change', () => { const t = opts.querySelector('.other'); if (t) t.required = t.parentNode.firstChild.checked; });
      // "Pick up to N." in the title: once N are ticked, the rest switch off until one is unticked
      const max = m[1] === 'checks' && m[2].match(/Pick up to (\d+)/);
      if (max) opts.addEventListener('change', () => {
        const full = opts.querySelectorAll(':checked').length >= +max[1];
        opts.querySelectorAll('[type=checkbox]:not(:checked)').forEach(x => x.disabled = full);
      });
    }
    (sub ? into : qs).append(card); i++;
  }
  // email (collected by Google, not a question) is a line right after Phone; then number every card
  const phone = [...qs.querySelectorAll('.field')].find(l => l.firstChild.textContent === 'Phone');
  const email = row(phone.parentNode, 'Email', '', 'email');
  email.name = 'emailAddress'; email.required = true; email.parentNode.parentNode.classList.add('req'); phone.after(email.parentNode.parentNode); livelink(email, 'mailto');
  // all questions start closed (title only); one opens at a time when you click or tab into it.
  // Collapsed with max-height (not display:none) so the browser can still jump to a missed required answer.
  const cards = [...qs.children];
  // the open card goes in the address (#q3), so a refresh reopens it; no card open = start at the top
  const open = c => { cards.forEach(x => x.classList.toggle('open', x === c)); history.replaceState(null, '', c ? '#q' + (cards.indexOf(c) + 1) : location.pathname + location.search); };
  cards.forEach(c => {
    const body = document.createElement('div'); body.className = 'body';
    body.append(...[...c.childNodes].slice(1)); c.append(body);
    c.firstChild.addEventListener('click', () => open(c.classList.contains('open') ? null : c)); // click title again to close
    c.addEventListener('focusin', () => c.classList.contains('open') || open(c));
  });
  history.scrollRestoration = 'manual';
  const start = cards[+(location.hash.match(/^#q(\d+)$/) || [])[1] - 1];
  if (start) { open(start); start.scrollIntoView({ block: 'start' }); } else scrollTo(0, 0);
  // file boxes: picking again adds to the files already chosen (browsers replace them by default); names listed, × removes one
  qs.querySelectorAll('input[type=file]').forEach(f => {
    const keep = new DataTransfer(), list = document.createElement('ul'); list.className = 'files'; f.parentNode.after(list);
    const show = () => { f.files = keep.files; list.replaceChildren(...[...keep.files].map((file, k) => {
      const li = document.createElement('li'), x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.title = 'Remove';
      x.onclick = () => { keep.items.remove(k); show(); }; li.append(file.name, x); return li; })); };
    f.addEventListener('change', () => { const added = [...f.files]; added.forEach(file => [...keep.files].some(o => o.name === file.name && o.size === file.size) || keep.items.add(file)); show(); });
  });
  thanks = unq(src.match(/setConfirmationMessage\(('[^']*')/)[1]);
});

// Sends answers into the Google Form. Fill in from the "Web page hookup" line intake-form-google.gs logs.
const FORM = { action: '', entries: [] };
let thanks = '';
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  // browsers can't require "at least one" checkbox, so check those groups here
  const empty = [...document.querySelectorAll('.opts[data-req]')].find(o => !o.querySelector(':checked'));
  if (empty) { empty.closest('.card').firstChild.click(); empty.scrollIntoView({ block: 'center' }); return alert('Please pick at least one option for: ' + empty.parentNode.querySelector('.q').textContent); }
  if (!FORM.action) return alert('This form is not connected yet. Please call or email us instead.');
  const body = new URLSearchParams({ emailAddress: e.target.emailAddress.value });
  document.querySelectorAll('textarea[data-i], input[type=text][data-i], input[data-i]:checked').forEach(v => {
    const id = FORM.entries[v.dataset.i];
    if (v.value !== 'Other') return v.value && body.append(id, v.value); // blank optional links are skipped
    body.append(id, '__other_option__'); // how Google Forms receives a write-in answer
    body.append(id + '.other_option_response', v.parentNode.querySelector('.other').value);
  });
  // no-cors: Google won't let us read the reply, so we can't confirm it landed. Check the Sheet.
  fetch(FORM.action, { method: 'POST', mode: 'no-cors', body }).then(() => {
    e.target.outerHTML = `<div class="card"><h1>Thank you</h1><p>${thanks}</p></div>`;
    scrollTo(0, 0);
  }, () => alert('Could not send. Please check your connection and try again.'));
});

// footer: spread the name and title so their last letter ends right under the 7 of 941.500.3707
function alignTo7() {
  const tel = document.querySelector('.contact-links a[href^="tel:"]');
  const ls = parseFloat(getComputedStyle(tel).letterSpacing) || 0;
  const r = document.createRange(); r.selectNodeContents(tel);
  const end = r.getBoundingClientRect().right - ls;
  for (const el of document.querySelectorAll('.sig-name, .sig-role')) {
    el.style.letterSpacing = '0px';
    r.selectNodeContents(el);
    const box = r.getBoundingClientRect(), n = el.textContent.length;
    el.style.letterSpacing = (end - box.right) / (n - 1) + 'px';
  }
}
alignTo7();
document.fonts.ready.then(alignTo7);
addEventListener('resize', alignTo7);
addEventListener('beforeprint', alignTo7);
addEventListener('afterprint', alignTo7);
</script>
